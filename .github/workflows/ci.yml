name: Build, Test & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Package Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build all targets (Release)
      run: cmake --build build --config Release --parallel

    - name: Run CTest test suite
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Stage Release Package
      shell: pwsh
      run: |
        $pkg = "dist"
        New-Item -ItemType Directory -Path "$pkg/bin" -Force
        New-Item -ItemType Directory -Path "$pkg/shaders" -Force
        Copy-Item "build/bin/Release/*.exe" "$pkg/bin/" -Force
        Copy-Item "build/bin/Release/*.dll" "$pkg/bin/" -Force
        Copy-Item "shaders/*" "$pkg/shaders/" -Force
        Set-Content -Path "$pkg/dgpu.ini" -Value "192.168.1.14`n# writeback=1"
        Compress-Archive -Path "$pkg/*" -DestinationPath "DistributedGPU-windows-x64.zip" -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DistributedGPU-windows-x64
        path: DistributedGPU-windows-x64.zip
        retention-days: 30

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: DistributedGPU-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
