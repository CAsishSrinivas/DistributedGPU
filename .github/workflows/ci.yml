name: Build, Package & Release

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Package (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build all targets (Release)
      run: cmake --build build --config Release --parallel

    - name: Run CTest test suite
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Stage & Compress Release Package
      id: package
      shell: pwsh
      run: |
        $branch = "${{ github.ref_name }}"
        $isDevelop = ($branch -eq "develop")
        $assetName = if ($isDevelop) { "DistributedGPU-windows-x64-develop.zip" } else { "DistributedGPU-windows-x64-main.zip" }
        $tag = if ($isDevelop) { "develop-latest" } else { "main-latest" }

        $pkg = "dist"
        New-Item -ItemType Directory -Path "$pkg/bin" -Force | Out-Null
        New-Item -ItemType Directory -Path "$pkg/shaders" -Force | Out-Null
        Copy-Item "build/bin/Release/*.exe" "$pkg/bin/" -Force
        Copy-Item "build/bin/Release/*.dll" "$pkg/bin/" -Force
        Copy-Item "shaders/*" "$pkg/shaders/" -Force
        Set-Content -Path "$pkg/dgpu.ini" -Value "192.168.1.14`n# writeback=1"
        Compress-Archive -Path "$pkg/*" -DestinationPath $assetName -Force

        "asset_name=$assetName" >> $env:GITHUB_OUTPUT
        "release_tag=$tag" >> $env:GITHUB_OUTPUT
        "is_prerelease=$isDevelop" >> $env:GITHUB_OUTPUT

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.asset_name }}
        path: ${{ steps.package.outputs.asset_name }}
        retention-days: 30

    - name: Publish / Update GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $tag = "${{ steps.package.outputs.release_tag }}"
        $asset = "${{ steps.package.outputs.asset_name }}"
        $isPre = "${{ steps.package.outputs.is_prerelease }}" -eq "True"

        $title = if ($isPre) { "DistributedGPU Develop (Latest Build)" } else { "DistributedGPU Production (Stable)" }
        $notes = if ($isPre) {
          "Automated continuous integration release from develop branch for Laptop B / worker testing nodes."
        } else {
          "Production release from main branch. Validated stable release."
        }

        # Check if release already exists
        $releaseExists = gh release view $tag --json tagName 2>$null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Updating existing release $tag..." -ForegroundColor Cyan
          gh release upload $tag $asset --clobber
        } else {
          Write-Host "Creating new release $tag..." -ForegroundColor Cyan
          $preFlag = if ($isPre) { "--prerelease" } else { "" }
          gh release create $tag $asset --title $title --notes $notes $preFlag
        }
